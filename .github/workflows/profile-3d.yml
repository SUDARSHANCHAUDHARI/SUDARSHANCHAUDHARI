name: 3D contribution village

on:
  schedule:
    - cron: "0 18 * * *" # daily, 01:00 Bangkok
  workflow_dispatch:
  push:
    branches: [main]

# main requires pull requests, so the generated SVGs live on their own branch (output-3d)
# and the README links them via raw.githubusercontent.com. The snake keeps the output branch.
permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore yesterday's charts
        continue-on-error: true # first run: the branch does not exist yet
        run: |
          mkdir -p profile-3d-contrib
          git fetch --depth=1 origin output-3d
          git --work-tree=profile-3d-contrib checkout FETCH_HEAD -- .
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Red/black village
        continue-on-error: true # a missing village must not block publishing the charts
        run: python3 scripts/recolor_village.py profile-3d-contrib/profile-night-view.svg
      - name: Red/black commit-history chart
        continue-on-error: true # a commit-history.com outage must not block the village
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          curl -fsSL "https://commit-history.com/embed/${OWNER}?theme=dark" -o /tmp/commit-history.svg
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path("/tmp/commit-history.svg").read_text()
          # drop the "N contributions" total: the streak card is the single source for it
          src = re.sub(r'<text[^>]*>[\d,]+ contributions</text>', "", src)
          for old, new in {"#0d1117": "#050102", "#16a34a": "#ff2e4d", "#8b949e": "#a8828a",
                           "#30363d": "#3a0d14", "#c9d1d9": "#fff1f2", "#ffd43b": "#ff8a3d"}.items():
              src = src.replace(old, new)
          pathlib.Path("profile-3d-contrib").mkdir(exist_ok=True)
          pathlib.Path("profile-3d-contrib/commit-history.svg").write_text(src)
          PY
      - name: Red/black stats charts
        continue-on-error: true # a card-service outage keeps yesterday's charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_COUNT_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/profile_cards.py "${OWNER}" profile-3d-contrib
      # Published to output-3d with the other charts rather than committed to main, so the
      # workflow never writes to the default branch. Yesterday's cards are already in
      # profile-3d-contrib from the restore step, so a rate-limited run keeps their counts.
      - name: Mission cards with star counts
        continue-on-error: true # a rate-limited API must not block publishing the charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_mission_cards.py profile-3d-contrib/missions --stars

      - name: Publish to output-3d branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output-3d
          build_dir: profile-3d-contrib
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
