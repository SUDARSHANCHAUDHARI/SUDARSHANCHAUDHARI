<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<defs><style>.frame{fill:#140306;stroke:#ff2e4d;stroke-width:2;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
@media (prefers-reduced-motion:reduce){.frame{animation:none}}</style></defs>
<rect class="frame" x="1" y="1" width="238" height="54" rx="6"/>
<rect x="22" y="16" width="24" height="24" rx="4" fill="#ff2e4d"/><text x="34" y="33.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#140306" text-anchor="middle">in</text>
<text x="60" y="35" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#fff1f2" letter-spacing="1.5">LINKEDIN</text>
<g aria-hidden="true" clip-path="url(#fx-sweep-clip)"><defs><clipPath id="fx-sweep-clip"><rect x="1" y="1" width="238" height="54" rx="6"/></clipPath><linearGradient id="fx-sweep-band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2e4d" stop-opacity="0"/><stop offset=".5" stop-color="#ff2e4d" stop-opacity=".22"/><stop offset="1" stop-color="#ff2e4d" stop-opacity="0"/></linearGradient><style>.fx-sweep{animation:fx-sweep 7s cubic-bezier(.4,0,.6,1) infinite}@keyframes fx-sweep{0%{transform:translateX(-60px)}55%,100%{transform:translateX(298px)}}@media (prefers-reduced-motion:reduce){.fx-sweep{animation:none!important}}</style></defs><rect class="fx-sweep" x="1" y="1" width="60.0" height="54" fill="url(#fx-sweep-band)"/></g>
</svg>
